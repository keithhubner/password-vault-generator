name: Daily Dependency Updates

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check for existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          OPEN_PRS=$(gh pr list --search "head:deps/npm-updates" --state open --json number --jq 'length')
          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "Open dependency update PR already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check-pr.outputs.skip != 'true'
        run: npm ci

      - name: Check for outdated packages
        if: steps.check-pr.outputs.skip != 'true'
        id: outdated
        run: |
          OUTDATED=$(npm outdated --json 2>/dev/null || true)
          if [ -z "$OUTDATED" ]; then
            OUTDATED="{}"
          fi
          # Keep only packages where npm update will change the version
          UPDATABLE=$(echo "$OUTDATED" | jq '[to_entries[] | select(.value.current != .value.wanted)] | from_entries')
          COUNT=$(echo "$UPDATABLE" | jq 'length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "All dependencies are up to date."
          else
            echo "Found $COUNT updatable package(s):"
            echo "$UPDATABLE" | jq -r 'to_entries[] | "  \(.key): \(.value.current) → \(.value.wanted)"'
          fi

      - name: Update dependencies
        if: steps.check-pr.outputs.skip != 'true' && steps.outdated.outputs.count != '0'
        run: |
          npm update --save
          npm update --save-dev

      - name: Check for file changes
        if: steps.check-pr.outputs.skip != 'true' && steps.outdated.outputs.count != '0'
        id: changes
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No file changes after npm update."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            BEFORE=$(git show HEAD:package.json)
            AFTER=$(cat package.json)

            EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64)
            echo "report<<$EOF_MARKER" >> "$GITHUB_OUTPUT"
            jq -n \
              --argjson before "$BEFORE" \
              --argjson after "$AFTER" \
              -r '
              def merge_deps: [(.dependencies // {}), (.devDependencies // {})] | add // {};
              ($before | merge_deps) as $b |
              ($after | merge_deps) as $a |
              [$a | to_entries[] | select($b[.key] != null and $b[.key] != .value) |
                "| \(.key) | \($b[.key]) | \(.value) |"] | .[]
              ' >> "$GITHUB_OUTPUT"
            echo "$EOF_MARKER" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate — fresh install
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Validate — lint
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm run lint

      - name: Validate — build
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Validate — start server
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm start & echo $! > server.pid

      - name: Validate — wait for server
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/config > /dev/null 2>&1; then
              echo "Server is ready (attempt $i)"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          exit 1

      - name: Validate — API tests
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        run: npm run test:api

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi

      - name: Create pull request
        id: create-pr
        if: steps.check-pr.outputs.skip != 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="deps/npm-updates-$(date +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean up stale remote branch from previous failed runs
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add package.json package-lock.json
          git commit -m "chore(deps): update npm dependencies $(date +%Y-%m-%d)"
          git push -u origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(deps): update npm dependencies $(date +%Y-%m-%d)" \
            --body "$(cat <<EOF
          ## Automated Dependency Update

          Semver-compatible updates found and validated by the daily dependency workflow.

          ### Updated packages

          | Package | From | To |
          |---------|------|----|
          ${{ steps.changes.outputs.report }}

          ### Validation

          - [x] \`npm ci\` — clean install successful
          - [x] \`npm run lint\` — no lint errors
          - [x] \`npm run build\` — build successful
          - [x] \`npm run test:api\` — API tests passed

          > **Note:** These are semver-safe updates only (\`npm update\`). Major version bumps require manual review.
          EOF
          )" \
            --base main \
            --head "$BRANCH")

          echo "$PR_URL"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

  # Reviews the dependency PR and merges it only when Claude is highly
  # confident the bump is routine.
  #
  # Claude's only job here is to produce a JSON verdict. Every GitHub action
  # (commenting, merging) is done by the workflow from that verdict, so a
  # missing, malformed or unparseable verdict cannot result in a merge.
  #
  # Scope note: the diff on these PRs is package.json and package-lock.json -
  # version numbers, not the dependencies' source. The verdict reflects how
  # routine the bump looks, not whether the published package is safe.
  ai-review:
    needs: update-dependencies
    if: needs.update-dependencies.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write

    env:
      PR_NUMBER: ${{ needs.update-dependencies.outputs.pr_number }}
      # Auto-merge requires at least this confidence. See the rubric in the
      # prompt below before changing it.
      CONFIDENCE_THRESHOLD: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude dependency review
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(npm view:*)"'
          prompt: |
            Assess pull request #${{ needs.update-dependencies.outputs.pr_number }} in
            ${{ github.repository }}, an automated npm dependency update.

            Inspect the change with: git diff origin/main...HEAD -- package.json package-lock.json

            You are judging how ROUTINE this bump is. You cannot see the published
            source of these packages, so do not claim anything about whether a
            release is safe or malicious - judge only what the diff and the
            packages' public metadata support.

            Weigh:
              - semver distance: patch < minor < major (npm update should never
                produce a major bump; treat one as a red flag)
              - how widely used and well maintained each package is
              - how many transitive entries changed in package-lock.json relative
                to the direct dependencies
              - whether any package changed owner, repository URL or license
              - anything unusual: a brand new package, a version far ahead of the
                previous one, a package resolving to an unexpected registry

            The workflow has already verified that npm ci, lint, build and the API
            tests all pass on this branch. Factor that in, but remember green
            tests do not establish that a dependency is trustworthy.

            Confidence rubric (0-100), where the score is your confidence that
            merging this WITHOUT human review is the right call:
              90-100  every change is a patch or minor bump of an established,
                      widely used package; lockfile churn is proportionate;
                      nothing unusual
              70-89   routine overall, but something merits a human glance
              40-69   material uncertainty, or a change you cannot explain
              0-39    a major bump, a red flag above, or anything you would want
                      a person to look at

            Be conservative. If you are unsure, score lower. A missed merge costs
            someone a click; a wrong merge ships to production.

            Write your verdict to dep-review-verdict.json in the repository root,
            and write nothing else to the repo. Exactly this shape:

            {
              "confidence": <integer 0-100>,
              "summary": "<one or two sentences on what changed and why you scored it this way>",
              "packages": ["<name>: <from> -> <to>", ...],
              "concerns": ["<anything a human should know; empty array if none>"]
            }

            Do not post comments or interact with GitHub. The workflow reads this
            file and handles everything else.

      - name: Read verdict
        id: verdict
        run: |
          # Fail safe: any problem reading the verdict yields confidence 0, which
          # never merges.
          if [ ! -f dep-review-verdict.json ]; then
            echo "No verdict file produced (Claude step outcome: ${{ steps.claude.outcome }})."
            echo "confidence=0" >> "$GITHUB_OUTPUT"
            echo "reason=no-verdict" >> "$GITHUB_OUTPUT"
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq empty dep-review-verdict.json 2>/dev/null; then
            echo "Verdict file is not valid JSON."
            echo "confidence=0" >> "$GITHUB_OUTPUT"
            echo "reason=bad-json" >> "$GITHUB_OUTPUT"
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CONF=$(jq -r 'if (type == "object" and (.confidence | type) == "number") then (.confidence | floor) else "invalid" end' dep-review-verdict.json 2>/dev/null)
          if ! [[ "$CONF" =~ ^[0-9]+$ ]] || [ "$CONF" -gt 100 ]; then
            echo "Confidence is missing or not a number in 0-100 (got: $CONF)."
            echo "confidence=0" >> "$GITHUB_OUTPUT"
            echo "reason=bad-confidence" >> "$GITHUB_OUTPUT"
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Confidence: $CONF (threshold $CONFIDENCE_THRESHOLD)"
          echo "confidence=$CONF" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"

          if [ "$CONF" -ge "$CONFIDENCE_THRESHOLD" ]; then
            echo "should_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post assessment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIDENCE: ${{ steps.verdict.outputs.confidence }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "$REASON" = "ok" ]; then
            SUMMARY=$(jq -r '.summary // "No summary provided."' dep-review-verdict.json)
            PACKAGES=$(jq -r '(.packages // []) | if length == 0 then "_None listed._" else map("- `" + . + "`") | join("\n") end' dep-review-verdict.json)
            CONCERNS=$(jq -r '(.concerns // []) | if length == 0 then "_None raised._" else map("- " + .) | join("\n") end' dep-review-verdict.json)
          else
            SUMMARY="The review did not produce a usable verdict (\`$REASON\`), so this PR was left for manual review. Claude step outcome: \`${{ steps.claude.outcome }}\`."
            PACKAGES="_Unavailable._"
            CONCERNS="_Unavailable._"
          fi

          if [ "$CONFIDENCE" -ge "$CONFIDENCE_THRESHOLD" ]; then
            VERDICT="Confidence **$CONFIDENCE/100** meets the threshold of $CONFIDENCE_THRESHOLD - merging automatically."
          else
            VERDICT="Confidence **$CONFIDENCE/100** is below the threshold of $CONFIDENCE_THRESHOLD - leaving this PR open for you."
          fi

          gh pr comment "$PR_NUMBER" --body "$(cat <<EOF
          ## Claude dependency review

          $VERDICT

          $SUMMARY

          ### Packages

          $PACKAGES

          ### Notes

          $CONCERNS

          <sub>The diff here is version numbers, not dependency source, so this assesses how routine the bump looks - not whether the published packages are safe. Threshold is set in \`dependency-updates.yml\`.</sub>
          EOF
          )"

      - name: Merge if confident
        if: steps.verdict.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Belt and braces: re-check here so a mistyped step-level condition
          # cannot merge something below the threshold.
          CONF="${{ steps.verdict.outputs.confidence }}"
          if [ "$CONF" -lt "$CONFIDENCE_THRESHOLD" ]; then
            echo "Confidence $CONF is below $CONFIDENCE_THRESHOLD - refusing to merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --merge --delete-branch
          echo "Merged PR #$PR_NUMBER."
          echo "Note: this push was made with GITHUB_TOKEN, so it does not trigger" \
               "the deploy workflow. The update ships with the next deploy."
